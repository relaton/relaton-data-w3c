name: Deploy

on:
  push:
    # Include v2: many relaton-data-* repos moved their default branch to v2.
    # The reusable data-deploy.yml still gates publication on the repo's actual
    # default branch, so listing all three here is safe for main/master repos.
    branches: [ master, main, v2 ]
    tags: [ v* ]
  schedule:
  - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  # No branding inputs below. relaton/support#61 moved per-flavor Pages branding
  # into `data-index/configs.yml`, which the shared workflow resolves from
  # $GITHUB_REPOSITORY. It had to move: cimas maps this file as a verbatim
  # whole-file copy, so any `with:` line this repo hand-adds is wiped by the next
  # `cimas sync` — and for branding that failed silently, with nothing red in CI.
  # To change the title, favicon or description, edit the `w3c` row in
  # relaton/support's `data-index/configs.yml`, not this file.
  deploy:
    uses: relaton/support/.github/workflows/data-deploy.yml@main
    with:
      # TEMPORARY PIN — remove this `with:` block once relaton-cli ships `index`.
      #
      # The shared workflow builds the Pages index with `relaton index`
      # (relaton/relaton#83, relaton/support#58) and defaults to `source: gem`,
      # i.e. `gem install relaton-cli`. No published relaton-cli has the `index`
      # command yet: the latest stable is 2.1.2, and even the 3.0.0.pre.alpha.1
      # prerelease predates it. The default mode therefore fails with
      # `Could not find command "index"`.
      #
      # `source: git` instead builds relaton + relaton-cli from a GitHub
      # checkout (and compiles the Vue frontend with Node). We pass no
      # `relaton-repo`/`relaton-ref`, so it uses the shared workflow's defaults,
      # relaton/relaton@main — note the daily cron then tracks a moving upstream.
      source: git
